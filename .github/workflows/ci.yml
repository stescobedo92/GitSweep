name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack tool
        run: dotnet pack GitSweep.Cli/GitSweep.Cli.csproj --configuration Release --no-build --output artifacts -p:Version=0.0.0-ci.${{ github.run_number }} -p:PackageVersion=0.0.0-ci.${{ github.run_number }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitsweep-cli-nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
